name: Buscar vagas

on:
  schedule:
    - cron: "0 12 * * *" # 09:00 BRT
  workflow_dispatch:
    inputs:
      limpar:
        description: "Limpar o canal (apaga as mensagens do bot em vez de buscar vagas)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  vagas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python vagas_bot.py ${{ inputs.limpar && '--limpar' || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar histórico
        run: |
          if [ -n "$(git status --porcelain seen.json messages.json)" ]; then
            git config user.name "vagas-bot"
            git config user.email "vagas-bot@users.noreply.github.com"
            git add seen.json messages.json
            git commit -m "Atualiza histórico do bot"
            git push
          fi
